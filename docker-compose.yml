services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: loginiam-api:latest
    container_name: loginiam-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      VERBOSE: "false"
      # Proteksi Basic Auth khusus /metrics (ubah kredensial lewat file .env; ubah password di produksi)
      METRICS_AUTH_ENABLED: "${METRICS_AUTH_ENABLED:-true}"
      AUTH_USER: "${AUTH_USER:-admin}"
      AUTH_PASS: "${AUTH_PASS:-change-this-strong-password}"
      AUTH_REALM: "${AUTH_REALM:-loginiam}"
    # Batas resource agar container tetap ringan & tidak membebani host.
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
